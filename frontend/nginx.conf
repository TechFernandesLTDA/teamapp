server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Sem proxy de /api nem de /ws aqui, de proposito: o browser fala direto com
  # a API em :3001. Proxiar o upgrade do WebSocket pelo nginx e a fonte numero
  # um de falha silenciosa nesse tipo de stack (ver CLAUDE.md).
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # O HTML nao pode ser cacheado: ele referencia os assets com hash.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
